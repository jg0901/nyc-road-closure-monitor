# DRAFT — move to .github/workflows/collect.yml on Sunday (V2), after V1 is stable.
# NOTE: .gitignore currently excludes data/snapshots/*.gz, data/reports/ and logs/ — relax that (or switch to object storage) before enabling this.
# Persists history by committing manifest + snapshots back to the repo (small at first;
# move to object storage / Supabase when it grows — never rely on runner-local state).
name: collect-nyc-closures

on:
  schedule:
    - cron: "17 11 * * *"        # daily 11:17 UTC (odd minute avoids the :00 crowd)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest
      - name: Write config from example
        run: cp config/settings.example.json config/settings.json
      - name: Run collector
        id: collect
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python -m src.run --config config/settings.json
        continue-on-error: true           # we still want to commit the failure report
      - name: Persist history
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add data/snapshots data/reports logs || true
          git commit -m "collect: $(date -u +%Y-%m-%dT%H:%M:%SZ) status=${{ steps.collect.outcome }}" || echo "nothing to commit"
          git push
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with: { name: report, path: data/reports/latest.report.* }
      - name: Fail the job if the collector failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
      # Optional (Stage B): notify n8n
      # - run: curl -fsS -X POST "$N8N_WEBHOOK" -H 'content-type: application/json' --data @data/reports/latest.report.json
      #   env: { N8N_WEBHOOK: ${{ secrets.N8N_WEBHOOK }} }
